# =============================================================================
# infra-formateur — environnement hébergé pour la formation (VPS 4 vCore / 16 Go)
# =============================================================================
# 8 postes stagiaires (code-server = VS Code navigateur) + DinD isolé chacun
# + 1 LocalStack PARTAGÉ (le "cloud" commun) + Caddy (reverse proxy, TLS auto).
# GitLab : on utilise gitlab.com (Mode Cloud) — pas de gitlab-ce ici.
#
#   cp .env.example .env   # définir DOMAIN, EMAIL, mots de passe
#   docker compose up -d
#
# Accès : lab1.example.com … lab8.example.com  (VS Code par stagiaire)
#         labls.example.com  (console LocalStack)
# =============================================================================

x-student-box: &student-box
  build: ./student-box
  image: gitops-student:local
  restart: unless-stopped
  # mem_limit / cpus : garde-fous pour que 8 postes cohabitent
  mem_limit: 1g
  # PAS de `networks:` ici : chaque poste PARTAGE la pile réseau de son DinD
  # (network_mode: service:dind-N, cf. plus bas). Ainsi un `docker run -p 9090:80`
  # (publié DANS le DinD) est joignable en http://localhost:9090 depuis le terminal,
  # et via le proxy code-server : https://labN.DOMAIN/proxy/9090/
  # → code-server écoute donc sur 13337 (pas 8080, que les stagiaires publient souvent).

x-dind: &dind
  # Image du sidecar DinD, choisie par .env (DIND_IMAGE) :
  #   - défaut (non défini)       → docker:27-dind   (lab GitOps standard)
  #   - DIND_IMAGE=dind-runc:local → DinD + runc/crane (lab Docker bas niveau, cf. 2512-docker-runc/)
  #     Construire l'image une fois :  docker build -t dind-runc:local ./dind -f ./dind/Dockerfile.runc
  image: ${DIND_IMAGE:-docker:27-dind}
  restart: unless-stopped
  privileged: true            # requis par DinD — ISOLÉ par stagiaire (pas le socket hôte)
  # DOCKER_TLS_CERTDIR="" → désactive le TLS et écoute en CLAIR sur 2375.
  # (docker:27-dind active TLS sur 2376 par défaut ; `--tls=false` seul ne suffit pas.)
  environment:
    DOCKER_TLS_CERTDIR: ""
  command: ["--host=tcp://0.0.0.0:2375", "--host=unix:///var/run/docker.sock"]
  mem_limit: 1g
  networks: [lab]

services:

  # --------- Reverse proxy (TLS wildcard via Cloudflare DNS-01) --------------
  # Image Caddy + plugin DNS Cloudflare (l'image stock caddy:2 ne l'inclut pas).
  # → certificat WILDCARD *.DOMAIN, qui fonctionne DERRIÈRE le proxy Cloudflare
  #   (le challenge HTTP-01 entrerait en conflit avec le proxy ; DNS-01 non).
  caddy:
    build: ./caddy            # Dockerfile = caddy + module cloudflare (xcaddy)
    image: caddy-cf:local
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:?DOMAIN manquant dans .env}              # ex: example.com (la ZONE)
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_API_TOKEN manquant dans .env}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # certificats (persistant)
      - caddy_config:/config
    networks: [lab]

  # --------- LocalStack PARTAGÉ (le cloud commun) ---------------------------
  # /!\ Depuis le 23/03/2026, les images LocalStack RÉCENTES (latest/stable) exigent
  #     un LOCALSTACK_AUTH_TOKEN, même pour le tier gratuit (exit code 55 sinon).
  #     On ÉPINGLE donc une version ANTÉRIEURE (3.8) qui tourne sans token, gratuite.
  #     (Alternative : créer un token Hobby gratuit sur app.localstack.cloud et le
  #      mettre dans .env → LOCALSTACK_AUTH_TOKEN, avec l'image récente.)
  localstack:
    image: localstack/localstack:3.8
    container_name: localstack    # nom fixe → résolu par les postes via http://localstack:4566
    restart: unless-stopped
    environment:
      - SERVICES=s3            # S3 suffit pour le lab (site statique J2-5)
      - DEBUG=0
    networks: [lab]
    # Accessible par les postes via http://localstack:4566 (réseau interne)

  # =========================== POSTES STAGIAIRES =============================
  # Chaque poste = 1 code-server + 1 DinD dédié, dans le MÊME namespace réseau
  # (network_mode: service:dind-N) → DOCKER_HOST=localhost, ports publiés sur localhost.
  # Caddy joint code-server via dind-N:13337 (le poste n'a plus d'IP propre).
  # /!\ si dind-N est recréé, `docker compose up -d` recrée aussi student-N.
  # (8 blocs explicites : Docker Compose ne « boucle » pas — anchors pour rester DRY.)

  student-1:
    <<: *student-box
    container_name: student-1
    environment:
      - PASSWORD=${S1_PASSWORD:?S1_PASSWORD manquant}
      - PROXY_DOMAIN=lab1-{{port}}.${DOMAIN}   # https://lab1-<port>.DOMAIN (auth code-server)
      - DOCKER_HOST=tcp://localhost:2375
    network_mode: "service:dind-1"  # partage le réseau du DinD (localhost commun)
    volumes: [home-1:/home/student]   # persiste le travail du stagiaire
    depends_on: [dind-1]
  dind-1: { <<: *dind, container_name: dind-1 }

